<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Lansing Codes Monthly Events</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <h1>Lansing Codes Monthly Events</h1>

  <label for="date-format">Date Format:</label>
  <input type="text" id="date-format" size="40" value="Do (ddd) h:mm a">
  <button type="button" id="refresh-format">Update</button>
  <aside>
    <a href="https://momentjs.com/docs/#/displaying/format/">
      Moment.js Formatting Documentation
    </a>
  </aside>

  <section>
    <h2><span id="next-month-name"></span> Events</h2>
    <ul id="next-month-event-list"></ul>
  </section>

  <section>
    <h2><span id="current-month-name"></span> Events</h2>
    <ul id="current-month-event-list"></ul>
  </section>

  <section aria-labelledby="email-preview-heading">
    <h2 id="email-preview-heading">Branded email preview</h2>
    <p>Ready-to-paste HTML for Mailchimp, with inline styling and a plain-text alternative.</p>
    <button id="copy-email" type="button" disabled>Copy formatted email</button>
    <button id="download-email" type="button" disabled>Download HTML</button>
    <p id="email-status" role="status">Loading events for the email preview…</p>
    <iframe id="email-preview" title="Branded newsletter email preview" sandbox=""></iframe>
  </section>

  <script src="./vendor/moment.min.js"></script>
  <script src="./vendor/moment-timezone.min.js"></script>
  <script src="./vendor/moment-timezone-detroit.js"></script>
  <script type="module" src="./index.js"></script>
</body>
</html>
